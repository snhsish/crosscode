services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crosscode-web
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - apps/web/.env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  tunnel-server:
    build:
      context: .
      dockerfile: packages/tunnel-server/Dockerfile
    container_name: crosscode-tunnel
    restart: always
    ports:
      - "3100:3100"
    env_file:
      - packages/tunnel-server/.env
    environment:
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

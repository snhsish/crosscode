name: Release

on:
  push:
    tags:
      - '@crosscode/*'
      - 'crosscode@*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create GitHub Release
        run: |
          TAG=${{ github.ref_name }}
          gh release create "$TAG" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Deploy Tunnel

on:
  push:
    branches:
      - main
    paths:
      - 'packages/tunnel-server/**'
      - 'packages/shared/**'
      - 'pnpm-lock.yaml'
  workflow_dispatch:

concurrency:
  group: deploy-tunnel
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/tunnel-server/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/tunnel-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker pull ghcr.io/${{ github.repository }}/tunnel-server:latest
            docker stop crosscode-tunnel || true
            docker rm crosscode-tunnel || true
            docker run -d \
              --name crosscode-tunnel \
              --restart always \
              -p 3100:3100 \
              --env-file /home/deploy/crosscode/packages/tunnel-server/.env \
              ghcr.io/${{ github.repository }}/tunnel-server:latest
            docker image prune -f || true
            exit 0
